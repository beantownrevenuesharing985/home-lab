apiVersion: v1
kind: Namespace
metadata:
  name: uptime
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: uptime
  namespace: uptime
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: uptime
  template:
    metadata:
      labels:
        app: uptime
    spec:
      automountServiceAccountToken: false
      dnsPolicy: "None"
      dnsConfig:
        nameservers:
          - 8.8.8.8
          - 1.1.1.1
      securityContext:
        fsGroup: 1000
      containers:
        - name: uptime
          image: louislam/uptime-kuma:2.4.0
          imagePullPolicy: Always
          ports:
            - containerPort: 3001
          env:
            - name: NODE_TLS_REJECT_UNAUTHORIZED
              value: "0"
          volumeMounts:
            - name: uptime-data
              mountPath: /app/data
      volumes:
        - name: uptime-data
          hostPath:
            path: /mnt/storage/uptime-data
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: uptime-service
  namespace: uptime
spec:
  type: ClusterIP
  selector:
    app: uptime
  ports:
    - port: 3001
      targetPort: 3001
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: uptime-ingress
  namespace: uptime
  annotations:
    kubernetes.io/ingress.class: traefik
spec:
  ingressClassName: traefik
  rules:
    - host: lab-status.mdmahfujarrahman.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: uptime-service
                port:
                  number: 3001
