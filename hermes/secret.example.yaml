# Copy to secret.yaml (gitignored), fill in real values, then:
#   kubectl apply -f secret.yaml
# Apply this BEFORE hermes.yaml — the Deployment envFrom's both Secrets.
---
apiVersion: v1
kind: Secret
metadata:
  name: hermes-secrets
  namespace: hermes
type: Opaque
stringData:
  # 9router API key (OpenAI-compatible gateway in this cluster).
  GOOGLE_API_KEY: "<9router-api-key>"
  GEMINI_API_KEY: "<9router-api-key>"
  # From @BotFather.
  TELEGRAM_BOT_TOKEN: "<telegram-bot-token>"
  # Only these Telegram account IDs may talk to the bot. Without this, anyone
  # who finds the bot handle can drive the agent's tools/terminal.
  TELEGRAM_ALLOWED_USERS: "<your-telegram-user-id>"
  TELEGRAM_HOME_CHANNEL: "<your-telegram-user-id>"
  # Hermes's own dashboard auth gate (mandatory for non-loopback binds).
  #   openssl rand -base64 24
  HERMES_DASHBOARD_BASIC_AUTH_PASSWORD: "<dashboard-password>"
---
apiVersion: v1
kind: Secret
metadata:
  name: hermes-dashboard-basicauth
  namespace: hermes
type: Opaque
stringData:
  # Traefik BasicAuth middleware — htpasswd (apr1) format. Second auth layer
  # in front of Hermes's own dashboard auth gate. Generate with:
  #   htpasswd -nb admin '<password>'
  users: "admin:<apr1-hash>"
