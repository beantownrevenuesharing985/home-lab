apiVersion: v1
kind: Namespace
metadata:
  name: affine
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: affine-db
  namespace: affine
spec:
  replicas: 1
  selector:
    matchLabels:
      app: affine-db
  template:
    metadata:
      labels:
        app: affine-db
    spec:
      automountServiceAccountToken: false
      containers:
        - name: postgres
          image: postgres:15-alpine
          env:
            - name: POSTGRES_USER
              value: "affine"
            - name: POSTGRES_DB
              value: "affine"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: affine-secrets
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: db-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: db-data
          hostPath:
            path: /mnt/storage/affine-db
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: affine-db-service
  namespace: affine
spec:
  selector:
    app: affine-db
  ports:
    - port: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: affine-redis
  namespace: affine
spec:
  replicas: 1
  selector:
    matchLabels:
      app: affine-redis
  template:
    metadata:
      labels:
        app: affine-redis
    spec:
      automountServiceAccountToken: false
      containers:
        - name: redis
          image: redis:7-alpine
---
apiVersion: v1
kind: Service
metadata:
  name: affine-redis-service
  namespace: affine
spec:
  selector:
    app: affine-redis
  ports:
    - port: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: affine-app
  namespace: affine
spec:
  replicas: 1
  selector:
    matchLabels:
      app: affine-app
  template:
    metadata:
      labels:
        app: affine-app
    spec:
      automountServiceAccountToken: false
      dnsPolicy: "None"
      dnsConfig:
        nameservers:
          - 8.8.8.8
          - 1.1.1.1
      initContainers:
        - name: migration
          image: ghcr.io/toeverything/affine:stable
          command: ["sh", "-c", "node ./scripts/self-host-predeploy.js"]
          # DATABASE_URL carries the DB password, so it lives in the Secret.
          envFrom:
            - secretRef: { name: affine-secrets }
          env:
            # Hardcoded ClusterIPs, not service DNS names, on purpose: this pod
            # runs with dnsPolicy None and only public resolvers (see below), so
            # *.svc.cluster.local does not resolve here.
            - name: REDIS_SERVER_HOST
              value: "10.43.4.240"
            - name: NODE_ENV
              value: "production"
      containers:
        - name: affine
          image: ghcr.io/toeverything/affine:stable
          ports:
            - containerPort: 3010
          resources:
            requests:
              memory: "1.5Gi"
              cpu: "250m"
              ephemeral-storage: "1Gi"
            limits:
              memory: "3Gi"
              cpu: "1500m"
              ephemeral-storage: "2Gi"
          # DATABASE_URL, admin credentials and SMTP credentials all come from
          # the Secret — see secret.example.yaml.
          envFrom:
            - secretRef: { name: affine-secrets }
          env:
            - name: NODE_ENV
              value: "production"
            - name: REDIS_SERVER_HOST
              value: "10.43.4.240"
            - name: AFFINE_SERVER_EXTERNAL_URL
              value: "https://notes.mdmahfujarrahman.com"
            - name: AFFINE_SERVER_HTTPS
              value: "true"
            - name: AFFINE_CONFIG_PATH
              value: "/root/.affine/config"
            # Admin user is created on first startup from AFFINE_ADMIN_EMAIL /
            # AFFINE_ADMIN_PASSWORD in the Secret.
            # SMTP host/port are not secret; user/password/sender are.
            - name: MAILER_HOST
              value: "smtp.gmail.com"
            - name: MAILER_PORT
              value: "465"
            - name: MAILER_SECURE
              value: "true"
            - name: MAILER_SERVERNAME
              value: "notes.mdmahfujarrahman.com"
            # AI/Copilot - selfhosted mode enables custom providers
            - name: selfhosted
              value: "true"
            - name: NODE_TLS_REJECT_UNAUTHORIZED
              value: "0"
          volumeMounts:
            - name: config-data
              mountPath: /root/.affine/config
            - name: storage-data
              mountPath: /root/.affine/storage
      volumes:
        - name: config-data
          hostPath:
            path: /mnt/storage/affine-config
            type: DirectoryOrCreate
        - name: storage-data
          hostPath:
            path: /mnt/storage/affine-assets
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: affine-service
  namespace: affine
spec:
  type: ClusterIP
  selector:
    app: affine-app
  ports:
    - port: 3010
      targetPort: 3010
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: affine
  namespace: affine
  annotations:
    kubernetes.io/ingress.class: "traefik"
spec:
  ingressClassName: traefik
  rules:
    - host: notes.mdmahfujarrahman.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: affine-service
                port:
                  number: 3010
