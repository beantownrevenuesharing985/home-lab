# Copy to secret.yaml (gitignored), fill in real values, then:
#   kubectl apply -f secret.yaml
# Apply this BEFORE affine.yaml — both the Postgres pod and the app pod read it.
---
apiVersion: v1
kind: Secret
metadata:
  name: affine-secrets
  namespace: affine
type: Opaque
stringData:
  # Postgres password. Must match the password inside DATABASE_URL below.
  POSTGRES_PASSWORD: "<postgres-password>"
  # Host is the affine-db-service ClusterIP, not a DNS name: the app pod runs
  # with dnsPolicy None and public resolvers only, so cluster DNS is unavailable.
  #   kubectl -n affine get svc affine-db-service -o jsonpath='{.spec.clusterIP}'
  DATABASE_URL: "postgres://affine:<postgres-password>@<affine-db-service-clusterip>:5432/affine?sslmode=disable"
  # Seed admin account, created on first startup.
  AFFINE_ADMIN_EMAIL: "<admin-email>"
  AFFINE_ADMIN_PASSWORD: "<admin-password>"
  # SMTP. For Gmail this is an App Password, not the account password.
  MAILER_USER: "<smtp-user>"
  MAILER_PASSWORD: "<smtp-app-password>"
  MAILER_SENDER: "<from-address>"
