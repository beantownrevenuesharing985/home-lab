apiVersion: v1
kind: PersistentVolume
metadata:
  name: nfs-pv-storage
spec:
  capacity:
    storage: 900Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  mountOptions:
    - hard
    - nfsvers=3
  nfs:
    path: /mnt/storage1tb
    server: 192.168.68.103
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nfs-pvc-storage
  namespace: affine
spec:
  storageClassName: ""
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 700Gi
  volumeName: nfs-pv-storage
