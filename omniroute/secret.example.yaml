# Copy to secret.yaml (gitignored), fill in real values, then:
#   kubectl apply -f secret.yaml
# Apply this BEFORE omniroute.yaml.
---
apiVersion: v1
kind: Secret
metadata:
  name: omniroute-secrets
  namespace: omniroute
type: Opaque
stringData:
  # openssl rand -base64 48
  JWT_SECRET: "<random-48-bytes>"
  # openssl rand -hex 32
  API_KEY_SECRET: "<random-hex-32>"
  # First-run admin password — change it in the UI after first login.
  INITIAL_PASSWORD: "<initial-admin-password>"
  # openssl rand -base64 32
  OMNIROUTE_WS_BRIDGE_SECRET: "<random-32-bytes>"
