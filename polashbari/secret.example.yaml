# Copy to secret.yaml (gitignored), fill in real values, then:
#   kubectl apply -f secret.yaml
# Apply this BEFORE polashbari.yaml.
---
apiVersion: v1
kind: Secret
metadata:
  name: polashbari-secrets
  namespace: polashbari
type: Opaque
stringData:
  # better-auth signing secret: openssl rand -hex 32
  BETTER_AUTH_SECRET: "<random-hex-32>"
  # Seed admin account, created on first boot.
  ADMIN_EMAIL: "<admin-email>"
  ADMIN_PASSWORD: "<admin-password>"
  ADMIN_NAME: "<admin-display-name>"
