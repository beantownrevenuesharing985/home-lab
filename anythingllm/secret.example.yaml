# Copy to secret.yaml (gitignored), fill in real values, then:
#   kubectl apply -f secret.yaml
# Apply this BEFORE anythingllm.yaml.
---
apiVersion: v1
kind: Secret
metadata:
  name: anythingllm-secrets
  namespace: anythingllm
type: Opaque
stringData:
  # All three: openssl rand -hex 16 (use a different value for each).
  JWT_SECRET: "<random-hex-16>"
  SIG_KEY: "<random-hex-16>"
  SIG_SALT: "<random-hex-16>"
